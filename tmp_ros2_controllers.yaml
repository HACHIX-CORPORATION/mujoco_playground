controller_manager:
  ros__parameters:
    update_rate: 500 
    thread_priority: 99
    lock_memory: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: psmc_trajectory_controller/PsmcTrajectoryController

    left_arm_position_controller:
      type: psmc_position_controller/PsmcPositionController

    left_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: psmc_trajectory_controller/PsmcTrajectoryController

    right_arm_position_controller:
      type: psmc_position_controller/PsmcPositionController

    right_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true

left_arm_controller:
  ros__parameters:
    joints:
      - left_arm_joint1
      - left_arm_joint2
      - left_arm_joint3
      - left_arm_joint4
      - left_arm_joint5
      - left_arm_joint6
      - left_arm_joint7
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity

    gains:
      left_arm_joint1: {K: 500.0, B: 7.0, L: 500.0, F: 10.0, H: 0.4, V: 0.8, VAR_MODE: 0, gain_ratio: 0.4472}
      left_arm_joint2: {K: 500.0, B: 7.0, L: 500.0, F: 10.0, H: 0.4, V: 0.8, VAR_MODE: 0, gain_ratio: 0.4472}
      left_arm_joint3: {K: 100.0, B: 3.0, L: 100.0, F: 5.0, H: 0.4, V: 0.8, VAR_MODE: 0, gain_ratio: 0.4472}
      left_arm_joint4: {K: 100.0, B: 3.0, L: 100.0, F: 5.0, H: 0.4, V: 0.8, VAR_MODE: 0, gain_ratio: 0.4472}
      left_arm_joint5: {K: 100.0, B: 3.0, L: 100.0, F: 2.0, H: 0.4, V: 0.8, VAR_MODE: 0, gain_ratio: 0.4472}
      left_arm_joint6: {K: 100.0, B: 3.0, L: 100.0, F: 2.0, H: 0.4, V: 0.8, VAR_MODE: 0, gain_ratio: 0.4472}
      left_arm_joint7: {K: 100.0, B: 3.0, L: 100.0, F: 2.0, H: 0.4, V: 0.8, VAR_MODE: 0, gain_ratio: 0.4472}

    allow_partial_joints_goal: true
  
left_arm_position_controller:
  ros__parameters:
    joints:
      - left_arm_joint1
      - left_arm_joint2
      - left_arm_joint3
      - left_arm_joint4
      - left_arm_joint5
      - left_arm_joint6
      - left_arm_joint7
    is_left: true
    gains:
      left_arm_joint1: {K: 500.0, B: 7.0, L: 500.0, F: 15.0, H: 0.4, V: 0.8, VAR_MODE: 0, gain_ratio: 0.4472}
      left_arm_joint2: {K: 500.0, B: 7.0, L: 500.0, F: 10.0, H: 0.4, V: 0.8, VAR_MODE: 0, gain_ratio: 0.4472}
      left_arm_joint3: {K: 100.0, B: 3.0, L: 100.0, F: 8.0, H: 0.4, V: 0.8, VAR_MODE: 0, gain_ratio: 0.4472}
      left_arm_joint4: {K: 100.0, B: 3.0, L: 100.0, F: 8.0, H: 0.4, V: 0.8, VAR_MODE: 0, gain_ratio: 0.4472}
      left_arm_joint5: {K: 100.0, B: 3.0, L: 100.0, F: 2.0, H: 0.4, V: 0.8, VAR_MODE: 0, gain_ratio: 0.4472}
      left_arm_joint6: {K: 100.0, B: 3.0, L: 100.0, F: 2.0, H: 0.4, V: 0.8, VAR_MODE: 0, gain_ratio: 0.4472}
      left_arm_joint7: {K: 100.0, B: 3.0, L: 100.0, F: 2.0, H: 0.4, V: 0.8, VAR_MODE: 0, gain_ratio: 0.4472}

left_hand_controller:
  ros__parameters:
    joints:
      - left_index_proximal_joint
      - left_middle_proximal_joint
      - left_ring_proximal_joint
      - left_little_proximal_joint
      - left_thumb_abduction_joint
      - left_thumb_proximal_joint
  
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

